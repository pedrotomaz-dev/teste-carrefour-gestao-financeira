services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cashflow
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow
    ports:
      - "5432:5432"
    volumes:
      - cashflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672" # painel de administração: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/CashFlow.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Database__Provider: Postgres
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=cashflow;Username=cashflow;Password=cashflow"
      Messaging__Provider: RabbitMq
      RabbitMq__HostName: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  consolidation-worker:
    build:
      context: .
      dockerfile: src/CashFlow.ConsolidationWorker/Dockerfile
    environment:
      Database__Provider: Postgres
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=cashflow;Username=cashflow;Password=cashflow"
      RabbitMq__HostName: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  cashflow-postgres-data:
